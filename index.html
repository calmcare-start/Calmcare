
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CalmCare</title>

<style>

body {

  font-family: Arial, sans-serif;

  background: #eaf7f4;

  color: #244b48;

  text-align: center;

  padding: 30px 15px;

}

.card {

  background: white;

  padding: 25px;

  border-radius: 20px;

  max-width: 420px;

  margin: 30px auto;

  box-shadow: 0 4px 15px #c5ded8;

}

button {

  background: #438f83;

  color: white;

  border: none;

  padding: 14px 22px;

  border-radius: 12px;

  font-size: 17px;

}

</style>

</head>

<body>

<div class="card">

  <h1>🌿 CalmCare</h1>

  <h2>Your Peaceful Space</h2>

  <p>Take a deep breath. You deserve a moment of peace.</p>

  <button onclick="showMessage()">Find Calm</button>

  <p id="message"></p>

</div>

<script>

function showMessage() {

  document.getElementById("message").textContent =

    "Breathe in slowly. Breathe out gently. You are doing your best. 💚";

}

</script>

</body>

</html>
